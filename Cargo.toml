[package]
name = "paperhands"
version = "0.5.0"
edition = "2024"
description = "Local experiment lifecycle for agent-driven strategy research with offline semantic help"
authors = ["Boxy <bboxy450@gmail.com>"]
license = "MIT"
repository = "https://github.com/bboxy450/paperhands"
readme = "README.md"
keywords = ["cli", "agents", "research", "trading"]
categories = ["command-line-utilities"]
include = ["src/**", "assets/**", "skills/**", "docs/cli.md", "docs/experiments.md", "docs/agents.md", "docs/autoresearch.md", "docs/decisions.md", "docs/automation.md", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock", "examples/**", "tests/**"]

[dependencies]
clap = "4.6"
clap-how-to = "=0.1.4"
pocket-encoder = { version = "=0.1.1", features = ["search"] }
toml = "1.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
toml_edit = "0.25.17"

[dev-dependencies]
tempfile = "3"
